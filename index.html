<style>
:root{--ink:#123D31;--mut:#4B6B5F;--bg:#F6FBF8;--card:#fff;--line:#D9E9E0;--ac:#26CD7D;--acd:#0E7A4B;--act:#0B2A21;--ok:#D5F5E5;--okt:#0E6B43;--wn:#FFF1B8;--wnt:#5C4700;--er:#FBE4E0;--ert:#9E2F25;--nu:#E8EEEB;--nut:#4B6B5F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1{font-size:24px;line-height:30px;margin:0;font-weight:700}
h2{font-size:17px;line-height:24px;margin:0;font-weight:700}
.sm{font-size:12px;line-height:16px}.mut{color:var(--mut)}.b{font-weight:700}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#app{display:flex;min-height:100vh}
#side{display:none}
#main{flex:1;min-width:0;padding:20px 16px calc(88px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.wrap{display:flex;flex-direction:column;gap:16px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:600;position:relative}
.tb svg,.sn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--acd);font-weight:700}.tb.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.bd{position:absolute;top:8px;margin-left:18px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;margin-bottom:4px}
.rw{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rw:first-of-type{border-top:0}
.rw>.g{flex:1;min-width:0}
.rw svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cols{display:flex;flex-direction:column;gap:16px}
.tg{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none}.tg.on{background:var(--ac);border-color:var(--ac);color:var(--act)}.tg svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ln{background:none;border:0;padding:0;text-align:left;width:100%}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;line-height:18px;font-weight:600;background:var(--nu);color:var(--nut);white-space:nowrap}
.chip.ok{background:var(--ok);color:var(--okt)}.chip.wn{background:var(--wn);color:var(--wnt)}.chip.er{background:var(--er);color:var(--ert)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--act)}
.btn.sm2{min-height:40px;padding:0 14px;font-size:14px}
.btn.t{border-color:transparent;background:none;color:var(--mut)}
.btn.w{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;gap:4px;padding:4px;background:var(--nu);border-radius:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:700;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.fl{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.fl.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 6px}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.fi{display:flex;gap:10px}.fi>*{flex:1;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:#E3F6EC;color:var(--acd);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.dt{width:44px;height:44px;border-radius:12px;background:#E3F6EC;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.1}
.dt b{font-size:17px}.dt span{font-size:11px;color:var(--mut);font-weight:600}
.big{font-size:26px;line-height:32px;font-weight:700}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kp{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#F6FBF8}
.bub{max-width:84%;padding:10px 14px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.bub.c{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.k{align-self:flex-end;background:#E3F6EC;border-bottom-right-radius:4px}
.empty{text-align:center;padding:24px 8px;color:var(--mut)}
.sk{border-radius:12px;background:linear-gradient(90deg,#E8EEEB,#F3F7F5,#E8EEEB);background-size:200% 100%;animation:sh 1.3s infinite;min-height:56px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
#bn{position:sticky;top:0;z-index:15;margin:-20px -16px 16px}
.bn{padding:10px 16px;font-size:13px;font-weight:600;background:var(--wn);color:var(--wnt)}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(18,61,49,.35)}
.panel{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.ph{display:flex;align-items:center;gap:8px;margin:-4px 0 8px}
.ph h2{flex:1}
.x{width:44px;height:44px;border-radius:12px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.x svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.on{opacity:1}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:var(--act);box-shadow:0 8px 20px rgba(18,61,49,.22);display:flex;align-items:center;justify-content:center;z-index:25}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--acd)}
.sw{position:relative;width:48px;height:28px;border-radius:14px;border:0;background:#C9D6CF;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw.on{background:var(--ac)}.sw.on::after{left:23px}
@media (min-width:1024px){
 #side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:232px;padding:24px 14px;background:#fff;border-right:1px solid var(--line)}
 #tabs{display:none}
 #main{margin-left:232px;max-width:none;padding:32px 40px 48px}
 .wrap{max-width:1040px;margin:0 auto}
 #bn{margin:-32px -40px 20px}
 .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
 .sn{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:14px;border:0;background:none;font-weight:600;font-size:15px;color:var(--ink);text-align:left;position:relative}
 .sn.on{background:#E3F6EC;color:var(--acd);font-weight:700}
 .sn .bd{position:static;margin-left:auto}
 #sheet.on{align-items:stretch;justify-content:flex-end}
 .panel{max-width:520px;height:100vh;max-height:none;border-radius:20px 0 0 20px}
 #toast{bottom:32px}
 .fab{right:32px;bottom:32px}
}
@media (max-width:359px){#main{padding-left:12px;padding-right:12px}#bn{margin-left:-12px;margin-right:-12px}.btn{padding:0 14px}}
</style>
</head>
<body>
<div id="app">
 <aside id="side" aria-label="Menu utama"></aside>
 <main id="main"><div id="bn"></div><div id="view" class="wrap" aria-live="polite"></div></main>
 <nav id="tabs" aria-label="Menu utama"></nav>
</div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="scrim" data-a="tutup"></div><div class="panel" id="panel"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="login"><div style="width:100%;max-width:360px;text-align:center">
 <div class="lg" style="justify-content:center;margin-bottom:6px"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 4h22v13c0 6-6 9-11 11C11 26 5 23 5 17z" fill="#26CD7D"/><path d="M11 21V10h4a3 3 0 010 6h-4M19 10v11M19 15l4-5M19 15l4 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>PinaraK</div>
 <p class="mut" style="margin:0 0 16px">Masukkan kode akses untuk membuka PinaraK</p>
 <input id="lkey" class="inp" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Kode akses" aria-label="Kode akses">
